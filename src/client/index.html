<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cake Cut</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="cake-menu">
      <select id="cake-picker" aria-label="Cake"></select>
      <div id="credit"></div>
      <button id="show-credits">Credits</button>
    </div>
    <dialog id="credits">
      <h1>Cake Cut</h1>
      <p>Inspired by the German game show <i>Schlag den Henssler</i>.</p>
      <p>By Blake Spangenberg.</p>
      <h2>Cakes</h2>
      <div id="cake-credits"></div>
      <form method="dialog"><button>Close</button></form>
    </dialog>
    <div id="clock"></div>
    <button id="cut">Cut!</button>
    <div id="result" hidden>
      <div id="grams"></div>
      <div id="score"></div>
      <button id="again">Again</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
